<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tela de Login</title>
    <style>
       body{
         font-family: arial, helvetica, sans-serif;
         background-image: linear-gradient(16deg, rgb(138, 29, 29), black);
        }
div{
    background-color: rgba(0,0,0.9);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    padding: 60px;
    border-radius: 15px;
    color: rgb(236, 244, 245);
}
form{
    padding: 35px;
    border:none;
    outline: none;
    font-size: 15px;
}
button{
    background-color: blue;
    border: none;
    padding: 15px;
    width: 100%;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    cursor: pointer;
}
button:hover{
    background-color: brown;
    cursor: pointer;
}
    </style>
</head>
<body>
    <div class="tela-de-login">
        <h1>Vamos Calcular?</h1>
        <form action="processoLogin.php" method="POST">
        <h2>Acesse a Maquina</h2>
        <label>Usuário:</label>
        <input type="text" name="usuario" required>
<br> <br>
        <label>Senha:</label>
        <input type="password" name="senha" required>
<br> <br>
        <button type="submit">Entrar</button>
        
</form>
</body>
</html>
